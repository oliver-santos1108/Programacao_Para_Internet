
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sorteio de Números</title>
</head>
<style>
     body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        color: #333;
        }
    a{
      text-decoration: none;
    }
    a:hover{
      text-decoration: underline;
    }
    section , div {
      margin-bottom: 30px;
      padding-top: 10px;
    }
    p { 
      margin: 8px 0; 
      padding: 5px; 
    }
    button { 
    padding: 10px 20px; 
    font-size: 16px; 
    cursor: pointer; 
    background-color: #007BFF; 
    color: white; border: none; 
    border-radius: 4px; 
    }
     button:hover { 
         background-color: #0056b3; 
    }
</style>
<body>

    <h1>Sorteio de Números</h1>

    <label>Mínimo:</label>
    <input type="number" id="minimo">

    <br><br>

    <label>Máximo:</label>
    <input type="number" id="maximo">

    <br><br>

    <button onclick="sortear()">Sortear</button>

    <p id="resultado"></p>

    <h2>Números sorteados:</h2>
    <ul id="lista"></ul>

    <script>
        let sorteados = [];

        function sortear() {

            let minimo = parseInt(document.getElementById("minimo").value);
            let maximo = parseInt(document.getElementById("maximo").value);

            if (isNaN(minimo) || isNaN(maximo) || minimo > maximo) {
                alert("Informe um intervalo válido!");
                return;
            }

            let numero = Math.floor(Math.random() * (maximo - minimo + 1)) + minimo;
            document.getElementById("resultado").innerHTML =
                "Número sorteado: " + numero;

            let encontrado = sorteados.find(item => item.numero === numero);

            if (encontrado) {
                encontrado.quantidade++;
            } else {
                sorteados.push({
                    numero: numero,
                    quantidade: 1
                });
            }
            let lista = document.getElementById("lista");
            lista.innerHTML = "";
            sorteados.forEach(item => {
                let li = document.createElement("li");

                li.innerHTML = item.numero +
                    " - Sorteado " + item.quantidade + " vez(es)";

                lista.appendChild(li);
            });
        }
    </script>

</body>
</html>
