<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <link rel="stylesheet" href="style3.css">
  </head>
  <body>
    <div class="container">
      <div class="fundo">
        <ul class="userLista">
          <li class="display">
            <img class="avatar"
              src="https://randomuser.me/api/portraits/women/44.jpg"
              alt="Linda Hart">
            <div class="info">
              <span class="nome">Linda Hart</span>
              <span class="endereco">6765 Shady Ln Dr</span>
            </div>
          </li>
          <li class="display">
            <img class="avatar"
              src="https://randomuser.me/api/portraits/men/32.jpg"
              alt="Roger Medina">
            <div class="info">
              <span class="nome">Roger Medina</span>
              <span class="endereco">2420 Paddock Way</span>
            </div>
          </li>
          <li class="display">
            <img class="avatar"
              src="https://randomuser.me/api/portraits/men/85.jpg"
              alt="Dean Sullivan">
            <div class="info">
              <span class="nome">Dean Sullivan</span>
              <span class="endereco">6727 Airplane Ave</span>
            </div>
          </li>
          <li class="display">
            <img class="avatar"
              src="https://randomuser.me/api/portraits/women/68.jpg"
              alt="Elizabeth Austin">
            <div class="info">
              <span class="nome">Elizabeth Austin</span>
              <span class="endereco">6685 Blossom Hill Rd</span>
            </div>
          </li>
        </ul>
      </div>
    </div>

  </body>
</html>
